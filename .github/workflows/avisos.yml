name: Avisos del equipo

# Cada vez que alguien sube cambios a main, explica el cambio en lenguaje sencillo
# y lo manda al grupo de Telegram y al canal de Discord. Los domingos manda el resumen semanal.
on:
  push:
    branches: [main]
  schedule:
    - cron: "13 0 * * 1" # domingo 7:13 p. m. hora de Colombia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Avisar
        run: node .github/avisos/avisar.mjs ${{ github.event_name == 'push' && 'cambio' || 'semana' }}
        env:
          IA_URL: ${{ secrets.IA_URL }}
          IA_KEY: ${{ secrets.IA_KEY }}
          IA_MODELO: ${{ secrets.IA_MODELO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
